<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#65d9e8"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#ffbf55"/></marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#c4a1ff"/></marker>
    <style>
      .title{font:700 42px 'DejaVu Sans',sans-serif;fill:#f3f7fa}
      .sub{font:400 20px 'DejaVu Sans',sans-serif;fill:#a9c3d2}
      .lane{font:700 17px 'DejaVu Sans',sans-serif;letter-spacing:2px}
      .box{font:700 20px 'DejaVu Sans',sans-serif;fill:#f4f7fb}
      .compact{font:700 16px 'DejaVu Sans',sans-serif;fill:#f4f7fb}
      .small{font:400 15px 'DejaVu Sans',sans-serif;fill:#cfdae2}
      .mini{font:400 13px 'DejaVu Sans',sans-serif;fill:#a9c3d2}
      .pill{font:700 13px 'DejaVu Sans',sans-serif;letter-spacing:1px}
      .arrow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#0b1724"/>
  <path d="M0 140H1600" stroke="#263c50" stroke-width="2"/>
  <text x="70" y="82" class="title">RISCO / COMO O SOM VIRA MÚSICA</text>
  <text x="72" y="118" class="sub">Criação, banco, grade e reprodução são etapas diferentes.</text>
  <g transform="translate(1115 60)">
    <rect width="18" height="18" rx="5" fill="#65d9e8"/><text x="28" y="15" class="small">ao vivo</text>
    <rect x="130" width="18" height="18" rx="5" fill="#628bea"/><text x="158" y="15" class="small">banco</text>
    <rect x="260" width="18" height="18" rx="5" fill="#ffbf55"/><text x="288" y="15" class="small">grade / música</text>
  </g>

  <rect x="50" y="165" width="1500" height="240" rx="22" fill="#102637" stroke="#28546b" stroke-width="2"/>
  <text x="78" y="199" class="lane" fill="#65d9e8">1 · TEXTO E DESENHO</text>
  <rect x="80" y="225" width="285" height="66" rx="13" fill="#18384a" stroke="#65d9e8" stroke-width="2"/>
  <text x="222" y="253" class="box" text-anchor="middle">TEXTO</text><text x="222" y="276" class="small" text-anchor="middle">palavras + pontuação</text>
  <rect x="80" y="315" width="285" height="66" rx="13" fill="#18384a" stroke="#65d9e8" stroke-width="2"/>
  <text x="222" y="343" class="box" text-anchor="middle">DESENHO / GLIFO</text><text x="222" y="366" class="small" text-anchor="middle">traços feitos com o mouse</text>
  <path d="M365 257H438V268H470" class="arrow" stroke="#65d9e8" marker-end="url(#arrow-cyan)"/>
  <path d="M365 348H438V298H470" class="arrow" stroke="#65d9e8" marker-end="url(#arrow-cyan)"/>
  <rect x="480" y="232" width="280" height="78" rx="15" fill="#174254" stroke="#65d9e8" stroke-width="2"/>
  <text x="620" y="263" class="box" text-anchor="middle">OUVIR TEXTO / DESENHO</text><text x="620" y="287" class="small" text-anchor="middle">som ao vivo · fora da grade</text>
  <path d="M760 271H820" class="arrow" stroke="#65d9e8" marker-end="url(#arrow-cyan)"/>
  <rect x="830" y="238" width="240" height="66" rx="33" fill="#133d4d" stroke="#65d9e8" stroke-width="2"/>
  <text x="950" y="278" class="box" text-anchor="middle">SAÍDA AO VIVO</text>
  <path d="M365 257H415V367H470M365 348H415V367" class="arrow" stroke="#628bea" marker-end="url(#arrow-violet)"/>
  <rect x="480" y="334" width="280" height="66" rx="13" fill="#20365e" stroke="#628bea" stroke-width="2"/>
  <text x="620" y="362" class="box" text-anchor="middle">GUARDAR CÉLULA</text><text x="620" y="385" class="small" text-anchor="middle">guarda no banco da performance</text>
  <path d="M760 367H820" class="arrow" stroke="#628bea" marker-end="url(#arrow-violet)"/>
  <rect x="830" y="334" width="240" height="66" rx="13" fill="#20365e" stroke="#628bea" stroke-width="2"/>
  <text x="950" y="376" class="box" text-anchor="middle">BANCO</text>
  <path d="M1070 366H1110V330H1150" class="arrow" stroke="#628bea" marker-end="url(#arrow-violet)"/>
  <rect x="1160" y="295" width="335" height="66" rx="13" fill="#172d4b" stroke="#628bea" stroke-width="2"/>
  <text x="1327" y="323" class="box" text-anchor="middle">OUVIR CÉLULA</text><text x="1327" y="346" class="small" text-anchor="middle">prévia isolada · não é a música inteira</text>
  <path d="M1070 385H1150" class="arrow" stroke="#ffbf55" marker-end="url(#arrow-amber)"/>
  <rect x="1160" y="368" width="335" height="37" rx="12" fill="#49361e" stroke="#ffbf55" stroke-width="2"/>
  <text x="1327" y="393" class="compact" text-anchor="middle">INSERIR CÉLULA · BANCO → GRADE</text>

  <rect x="50" y="425" width="1500" height="280" rx="22" fill="#211d35" stroke="#594779" stroke-width="2"/>
  <text x="78" y="459" class="lane" fill="#c4a1ff">2 · MÁQUINA DE FÓRMULAS</text>
  <rect x="80" y="490" width="240" height="60" rx="13" fill="#342951" stroke="#c4a1ff" stroke-width="2"/>
  <text x="200" y="516" class="compact" text-anchor="middle">TEXTO / DESENHO</text><text x="200" y="538" class="small" text-anchor="middle">ou um número</text>
  <path d="M320 520H360" class="arrow" stroke="#c4a1ff" marker-end="url(#arrow-violet)"/>
  <rect x="370" y="490" width="200" height="60" rx="13" fill="#342951" stroke="#c4a1ff" stroke-width="2"/>
  <text x="470" y="526" class="box" text-anchor="middle">SEED</text>
  <path d="M570 520H630" class="arrow" stroke="#c4a1ff" marker-end="url(#arrow-violet)"/>
  <rect x="640" y="482" width="245" height="76" rx="15" fill="#453361" stroke="#c4a1ff" stroke-width="2"/>
  <text x="762" y="514" class="box" text-anchor="middle">GERAR + TOCAR</text><text x="762" y="539" class="small" text-anchor="middle">cria fórmulas Bytebeat</text>
  <path d="M885 520H940" class="arrow" stroke="#65d9e8" marker-end="url(#arrow-cyan)"/>
  <rect x="950" y="490" width="250" height="60" rx="30" fill="#133d4d" stroke="#65d9e8" stroke-width="2"/>
  <text x="1075" y="516" class="box" text-anchor="middle">TOCA AO VIVO</text><text x="1075" y="538" class="small" text-anchor="middle">Bytebeat · contador t</text>
  <path d="M762 558V610H940" class="arrow" stroke="#628bea" marker-end="url(#arrow-violet)"/>
  <rect x="950" y="578" width="250" height="62" rx="13" fill="#20365e" stroke="#628bea" stroke-width="2"/>
  <text x="1075" y="605" class="box" text-anchor="middle">GUARDA NO BANCO</text><text x="1075" y="627" class="small" text-anchor="middle">cada cálculo fica na performance</text>
  <path d="M1200 608H1245" class="arrow" stroke="#ffbf55" marker-end="url(#arrow-amber)"/>
  <rect x="1255" y="578" width="240" height="62" rx="13" fill="#49361e" stroke="#ffbf55" stroke-width="2"/>
  <text x="1375" y="605" class="box" text-anchor="middle">PÕE NA GRADE</text><text x="1375" y="627" class="small" text-anchor="middle">automaticamente</text>
  <rect x="80" y="645" width="270" height="54" rx="12" fill="#20365e" stroke="#628bea" stroke-width="2"/>
  <text x="215" y="679" class="compact" text-anchor="middle">CÉLULA BYTEBEAT-PAI</text>
  <path d="M350 672H375" class="arrow" stroke="#c4a1ff" marker-end="url(#arrow-violet)"/>
  <rect x="385" y="645" width="275" height="54" rx="12" fill="#342951" stroke="#c4a1ff" stroke-width="2"/>
  <text x="522" y="668" class="compact" text-anchor="middle">MÁSCARA · XOR · WRAP</text>
  <text x="522" y="689" class="mini" text-anchor="middle">intensidade de 1 a 100</text>
  <path d="M660 672H685" class="arrow" stroke="#c4a1ff" marker-end="url(#arrow-violet)"/>
  <rect x="695" y="645" width="220" height="54" rx="12" fill="#453361" stroke="#c4a1ff" stroke-width="2"/>
  <text x="805" y="679" class="compact" text-anchor="middle">APLICAR GLITCH</text>
  <path d="M915 672H940" class="arrow" stroke="#ffbf55" marker-end="url(#arrow-amber)"/>
  <rect x="950" y="645" width="545" height="54" rx="12" fill="#49361e" stroke="#ffbf55" stroke-width="2"/>
  <text x="1222" y="668" class="compact" text-anchor="middle">FÓRMULA DERIVADA</text>
  <text x="1222" y="689" class="mini" text-anchor="middle">pai preservado · pré-escuta + banco + grade</text>

  <rect x="50" y="725" width="1500" height="170" rx="22" fill="#172438" stroke="#52647e" stroke-width="2"/>
  <text x="78" y="759" class="lane" fill="#8bb6ff">3 · FÓRMULA ESCRITA PELO MÚSICO</text>
  <rect x="80" y="785" width="260" height="70" rx="13" fill="#223451" stroke="#8bb6ff" stroke-width="2"/>
  <text x="210" y="815" class="box" text-anchor="middle">DIGITAR FÓRMULA</text><text x="210" y="839" class="small" text-anchor="middle">ex.: t * ((t &gt;&gt; 5) | (t &gt;&gt; 8))</text>
  <path d="M340 820H400" class="arrow" stroke="#8bb6ff" marker-end="url(#arrow-cyan)"/>
  <rect x="410" y="785" width="235" height="70" rx="13" fill="#223451" stroke="#8bb6ff" stroke-width="2"/>
  <text x="527" y="815" class="box" text-anchor="middle">COMPILAR FÓRMULA</text><text x="527" y="839" class="small" text-anchor="middle">confere a expressão</text>
  <path d="M645 820H700" class="arrow" stroke="#65d9e8" marker-end="url(#arrow-cyan)"/>
  <rect x="710" y="785" width="230" height="70" rx="13" fill="#174254" stroke="#65d9e8" stroke-width="2"/>
  <text x="825" y="815" class="box" text-anchor="middle">OUVIR FÓRMULA</text><text x="825" y="839" class="small" text-anchor="middle">prévia ao vivo</text>
  <path d="M645 820H670V870H980V820H1000" class="arrow" stroke="#628bea" marker-end="url(#arrow-violet)"/>
  <rect x="1010" y="785" width="300" height="70" rx="13" fill="#20365e" stroke="#628bea" stroke-width="2"/>
  <text x="1160" y="815" class="box" text-anchor="middle">GUARDAR → BANCO</text><text x="1160" y="839" class="small" text-anchor="middle">REC armado → banco + grade</text>

  <rect x="50" y="920" width="1500" height="145" rx="22" fill="#30271d" stroke="#91672c" stroke-width="2"/>
  <text x="78" y="954" class="lane" fill="#ffbf55">4 · O QUE TOCA A MÚSICA INTEIRA?</text>
  <rect x="100" y="976" width="270" height="62" rx="13" fill="#49361e" stroke="#ffbf55" stroke-width="2"/>
  <text x="235" y="1003" class="box" text-anchor="middle">GRADE DA MÚSICA</text><text x="235" y="1026" class="small" text-anchor="middle">células + posições + recortes</text>
  <path d="M370 1007H475" class="arrow" stroke="#ffbf55" marker-end="url(#arrow-amber)"/>
  <rect x="485" y="976" width="245" height="62" rx="13" fill="#49361e" stroke="#ffbf55" stroke-width="2"/>
  <text x="607" y="1003" class="box" text-anchor="middle">TOCAR MÚSICA</text><text x="607" y="1026" class="small" text-anchor="middle">executa só o que está na grade</text>
  <path d="M730 1007H835" class="arrow" stroke="#ffbf55" marker-end="url(#arrow-amber)"/>
  <rect x="845" y="976" width="225" height="62" rx="31" fill="#174254" stroke="#65d9e8" stroke-width="2"/>
  <text x="957" y="1014" class="box" text-anchor="middle">MASTER → SAÍDA</text>
  <rect x="1130" y="974" width="360" height="66" rx="13" fill="#172438" stroke="#52647e" stroke-width="2"/>
  <text x="1310" y="1001" class="box" text-anchor="middle">SALVAR</text><text x="1310" y="1025" class="small" text-anchor="middle">grava banco + grade no arquivo da música</text>

  <text x="70" y="1085" class="mini">Resumo: ao vivo = ouvir agora · banco = material guardado · grade = arranjo que toca como música.</text>
  <text x="70" y="1107" class="mini">O banco da música fica no arquivo salvo; o repositório local de fórmulas persiste entre aberturas.</text>
</svg>
