name: Risco platform evaluation builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        options: [all, linux-x86_64, windows-x86_64, macos]
        default: all
  pull_request:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-matrix.yml"
      - "third_party/ayumi/**"
permissions:
  contents: read
concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRISCO_JUCE_SOURCE_DIR=third_party/JUCE-9.0.3
            build: cmake --build build --parallel 2
            test: ctest --test-dir build --output-on-failure
            binary: build/risco_app_artefacts/Release/Risco
          - os: windows-2022
            name: windows-x86_64
            configure: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRISCO_JUCE_SOURCE_DIR=third_party/JUCE-9.0.3
            build: cmake --build build --config Release --parallel 2
            test: ctest --test-dir build -C Release --output-on-failure
            binary: build/risco_app_artefacts/Release/Risco.exe
          - os: macos-15
            name: macos
            configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRISCO_JUCE_SOURCE_DIR=third_party/JUCE-9.0.3
            build: cmake --build build --parallel 2
            test: ctest --test-dir build --output-on-failure
            binary: build/risco_app_artefacts/Release/Risco.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
      - uses: actions/checkout@v4
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        with:
          repository: juce-framework/JUCE
          ref: 9.0.3
          path: third_party/JUCE-9.0.3
          persist-credentials: false
      - if: ${{ (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name) && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxi-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libgl1-mesa-dev
      - if: ${{ (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name) && runner.os == 'macOS' }}
        run: brew install ninja
      - name: Configure
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        shell: bash
        run: ${{ matrix.configure }} 2>&1 | tee configure.log
      - if: ${{ failure() && runner.os == 'Windows' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name) }}
        uses: actions/upload-artifact@v4
        with:
          name: risco-windows-configure-log
          path: configure.log
          if-no-files-found: ignore
      - name: Build
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        shell: bash
        run: ${{ matrix.build }}
      - name: Test
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        shell: bash
        run: ${{ matrix.test }} 2>&1 | tee test.log
      - name: Diagnose Windows compositional test exit code
        if: ${{ failure() && runner.os == 'Windows' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name) }}
        shell: pwsh
        run: |
          & build/Release/risco_compositional_criteria_check.exe
          $exitCode = $LASTEXITCODE
          "Direct exit code: 0x{0:X8}" -f [uint32]$exitCode | Out-File -FilePath test-diagnostic.log -Append -Encoding utf8
          exit 0
      - if: ${{ failure() && runner.os == 'Windows' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name) }}
        uses: actions/upload-artifact@v4
        with:
          name: risco-windows-test-log
          path: |
            test.log
            test-diagnostic.log
          if-no-files-found: ignore
      - name: Confirm application artifact
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        shell: bash
        run: test -e "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.name }}
        with:
          name: risco-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
